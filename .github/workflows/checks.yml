name: Offline checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_push_studio.py
      - run: python tools/check_reliability.py
      - run: python tools/check_playing.py
      - run: python tools/check_arrangement.py
      - run: python tools/check_addon_actions.py
      - run: python tools/check_arrangement_ui.py
      - run: python tools/check_automation.py
      - run: python tools/check_native_automation.py
